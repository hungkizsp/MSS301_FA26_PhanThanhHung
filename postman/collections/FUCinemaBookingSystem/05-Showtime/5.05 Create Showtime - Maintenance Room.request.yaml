$kind: http-request
name: '5.5 Create Showtime - Maintenance Room'
order: 5000
method: POST
url: '{{gateway}}/api/showtimes'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "movieId": "{{movieId}}",
      "roomId": "{{seedRoomMaintenanceId}}",
      "startTime": "{{futureStart}}",
      "ticketPrice": 95000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
