$kind: http-request
name: '5.3 Create Showtime - Room 2'
order: 3000
method: POST
url: '{{gateway}}/api/showtimes'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "movieId": "{{movieId}}",
      "roomId": "{{seedRoom2Id}}",
      "startTime": "{{futureStart}}",
      "ticketPrice": 95000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.environment.set("showtime2Id", pm.response.json().showtimeId);
