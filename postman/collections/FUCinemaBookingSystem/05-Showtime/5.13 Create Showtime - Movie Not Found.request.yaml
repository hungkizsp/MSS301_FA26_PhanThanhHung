$kind: http-request
name: '5.13 Create Showtime - Movie Not Found'
order: 13000
method: POST
url: '{{gateway}}/api/showtimes'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "movieId": "{{notFoundId}}",
      "roomId": "{{roomId}}",
      "startTime": "{{futureStart}}",
      "ticketPrice": 95000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
