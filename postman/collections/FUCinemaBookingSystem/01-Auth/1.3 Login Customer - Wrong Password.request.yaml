$kind: http-request
name: '1.3 Login Customer - Wrong Password'
order: 3000
method: POST
url: '{{gateway}}/api/auth/login'
body:
  type: json
  content: |-
    {
      "email": "an@gmail.com",
      "password": "sai-mat-khau"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));

      const err = pm.response.json();
      pm.test("Error body format", () => {
          pm.expect(err).to.have.all.keys("timestamp", "status", "error", "message", "path");
          pm.expect(err.status).to.eql(pm.response.code);
      });
