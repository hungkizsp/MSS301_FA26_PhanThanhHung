$kind: http-request
name: '1.5 Login - Invalid Validation'
order: 5000
method: POST
url: '{{gateway}}/api/auth/login'
body:
  type: json
  content: |-
    {
      "email": "abc",
      "password": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));

      const err = pm.response.json();
      pm.test("Error body format", () => {
          pm.expect(err).to.have.all.keys("timestamp", "status", "error", "message", "path");
          pm.expect(err.status).to.eql(pm.response.code);
      });
