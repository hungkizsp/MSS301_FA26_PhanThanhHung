$kind: http-request
name: '6.6 Create Booking - Duplicate Seat In Request'
order: 6000
method: POST
url: '{{gateway}}/api/bookings'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer2Token}}'
body:
  type: json
  content: |-
    {
      "items": [
        {"showtimeId": "{{showtimeId}}", "seatCode": "A2"},
        {"showtimeId": "{{showtimeId}}", "seatCode": "A2"}
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
