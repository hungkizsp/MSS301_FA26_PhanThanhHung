$kind: http-request
name: '6.8 Create Booking - Cancelled Showtime'
order: 8000
method: POST
url: '{{gateway}}/api/bookings'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer2Token}}'
body:
  type: json
  content: |-
    {
      "items": [
        {"showtimeId": "{{showtime2Id}}", "seatCode": "A1"}
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
