$kind: http-request
name: '6.5 Create Booking - Invalid Seat Row'
order: 5000
method: POST
url: '{{gateway}}/api/bookings'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer2Token}}'
body:
  type: json
  content: |-
    {
      "items": [
        {"showtimeId": "{{showtimeId}}", "seatCode": "F1"}
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
