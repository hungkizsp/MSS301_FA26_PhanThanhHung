$kind: http-request
name: '7.9 Get My Bookings - Admin Forbidden'
order: 9000
method: GET
url: '{{gateway}}/api/bookings/my'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", () => pm.response.to.have.status(403));
