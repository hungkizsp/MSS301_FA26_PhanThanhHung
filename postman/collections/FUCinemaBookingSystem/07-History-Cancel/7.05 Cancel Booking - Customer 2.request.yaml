$kind: http-request
name: '7.5 Cancel Booking - Customer 2'
order: 5000
method: PUT
url: '{{gateway}}/api/bookings/{{booking2Id}}/cancel'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer2Token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Cancelled", () => pm.expect(pm.response.json().bookingStatus).to.eql("CANCELLED"));
