$kind: http-request
name: '7.1 Get My Bookings'
order: 1000
method: GET
url: '{{gateway}}/api/bookings/my'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const list = pm.response.json();
      pm.test("Only my bookings", () => list.forEach(b => pm.expect(b.customerId).to.eql(1)));
      pm.test("Sorted by bookingDate DESC", () => {
          for (let i = 1; i < list.length; i++) {
              pm.expect(list[i - 1].bookingDate >= list[i].bookingDate).to.be.true;
          }
      });
