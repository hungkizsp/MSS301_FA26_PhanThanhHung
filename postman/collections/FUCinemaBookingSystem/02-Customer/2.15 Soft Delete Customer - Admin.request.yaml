$kind: http-request
name: '2.15 Soft Delete Customer - Admin'
order: 15000
method: DELETE
url: '{{gateway}}/api/customers/{{adminCreatedId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204", () => pm.response.to.have.status(204));
