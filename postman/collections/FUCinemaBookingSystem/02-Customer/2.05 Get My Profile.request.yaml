$kind: http-request
name: '2.5 Get My Profile'
order: 5000
method: GET
url: '{{gateway}}/api/customers/me'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Email is an@gmail.com", () => pm.expect(pm.response.json().email).to.eql("an@gmail.com"));
