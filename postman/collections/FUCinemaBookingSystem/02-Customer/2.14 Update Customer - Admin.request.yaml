$kind: http-request
name: '2.14 Update Customer - Admin'
order: 14000
method: PUT
url: '{{gateway}}/api/customers/{{adminCreatedId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "customerName": "Khách hàng do Admin tạo (updated)",
      "telephone": "0911222333",
      "email": "{{adminEmail2}}",
      "customerBirthday": "1999-09-09",
      "customerStatus": "ACTIVE"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
