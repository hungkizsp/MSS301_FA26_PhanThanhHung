$kind: http-request
name: '2.18 Get Profile - Spoofed Header Overridden'
order: 18000
method: GET
url: '{{gateway}}/api/customers/me'
headers:
  - key: X-User-Id
    value: '2'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Gateway overrides spoofed X-User-Id", () => pm.expect(pm.response.json().email).to.eql("an@gmail.com"));
