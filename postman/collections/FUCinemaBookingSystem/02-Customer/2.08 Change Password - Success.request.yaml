$kind: http-request
name: 2.8 Change Password - Success
order: 8000
method: PUT
url: "{{gateway}}/api/customers/me/password"
auth:
  type: bearer
  credentials:
    token: "{{customer2Token}}"
body:
  type: json
  content: |-
    {
      "oldPassword": "123456",
      "newPassword": "654321"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Response time < 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      pm.test("Status 204", function () {
          pm.response.to.have.status(204);
      });
