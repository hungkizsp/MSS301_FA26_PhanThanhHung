$kind: http-request
name: '2.7 Change Password - Wrong Old Password'
order: 7000
method: PUT
url: '{{gateway}}/api/customers/me/password'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customer2Token}}'
body:
  type: json
  content: |-
    {
      "oldPassword": "sai",
      "newPassword": "654321"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
