$kind: http-request
name: '2.16 Get Customer - Soft Deleted INACTIVE'
order: 16000
method: GET
url: '{{gateway}}/api/customers/{{adminCreatedId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Soft deleted -> INACTIVE", () => pm.expect(pm.response.json().customerStatus).to.eql("INACTIVE"));
