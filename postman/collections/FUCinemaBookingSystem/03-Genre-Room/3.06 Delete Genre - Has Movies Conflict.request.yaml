$kind: http-request
name: '3.6 Delete Genre - Has Movies Conflict'
order: 6000
method: DELETE
url: '{{gateway}}/api/genres/{{seedGenreActionId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
