$kind: http-request
name: '3.7 Create Room'
order: 7000
method: POST
url: '{{gateway}}/api/rooms'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "roomName": "Room Test {{$timestamp}}",
      "roomType": "STANDARD",
      "seatRows": 5,
      "seatsPerRow": 8,
      "roomStatus": "ACTIVE"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      const room = pm.response.json();
      pm.test("totalSeats = seatRows x seatsPerRow", () => pm.expect(room.totalSeats).to.eql(40));
      pm.environment.set("roomId", room.roomId);
