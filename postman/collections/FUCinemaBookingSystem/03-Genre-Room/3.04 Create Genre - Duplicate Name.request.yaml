$kind: http-request
name: '3.4 Create Genre - Duplicate Name'
order: 4000
method: POST
url: '{{gateway}}/api/genres'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "genreName": "Hành động"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
