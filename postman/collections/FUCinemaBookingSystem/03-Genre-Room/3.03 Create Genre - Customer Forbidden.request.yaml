$kind: http-request
name: '3.3 Create Genre - Customer Forbidden'
order: 3000
method: POST
url: '{{gateway}}/api/genres'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{customerToken}}'
body:
  type: json
  content: |-
    {
      "genreName": "Tài liệu {{$timestamp}}",
      "description": "Phim tài liệu"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 403", () => pm.response.to.have.status(403));
