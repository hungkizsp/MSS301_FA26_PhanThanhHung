$kind: http-request
name: '3.2 Create Genre'
order: 2000
method: POST
url: '{{gateway}}/api/genres'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "genreName": "Tài liệu {{$timestamp}}",
      "description": "Phim tài liệu"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.environment.set("genreId", pm.response.json().genreId);
