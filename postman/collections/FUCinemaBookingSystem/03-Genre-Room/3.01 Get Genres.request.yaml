$kind: http-request
name: '3.1 Get Genres'
order: 1000
method: GET
url: '{{gateway}}/api/genres'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("At least 5 genres", () => pm.expect(pm.response.json().length).to.be.at.least(5));
