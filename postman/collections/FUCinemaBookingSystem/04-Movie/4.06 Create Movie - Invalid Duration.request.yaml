$kind: http-request
name: '4.6 Create Movie - Invalid Duration'
order: 6000
method: POST
url: '{{gateway}}/api/movies'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "title": "Hành Trình Phương Nam",
      "description": "Phim tài liệu về miền Tây sông nước.",
      "director": "Lê Hoàng",
      "durationMinutes": 10,
      "language": "Tiếng Việt",
      "ageRating": "P",
      "releaseDate": "2026-10-01",
      "genreId": "{{genreId}}",
      "movieStatus": "NOW_SHOWING"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
