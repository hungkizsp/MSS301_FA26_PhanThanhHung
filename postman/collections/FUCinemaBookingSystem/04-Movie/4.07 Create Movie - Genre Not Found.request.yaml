$kind: http-request
name: '4.7 Create Movie - Genre Not Found'
order: 7000
method: POST
url: '{{gateway}}/api/movies'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "title": "Hành Trình Phương Nam",
      "description": "Phim tài liệu về miền Tây sông nước.",
      "director": "Lê Hoàng",
      "durationMinutes": 120,
      "language": "Tiếng Việt",
      "ageRating": "P",
      "releaseDate": "2026-10-01",
      "genreId": "{{notFoundId}}",
      "movieStatus": "NOW_SHOWING"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
