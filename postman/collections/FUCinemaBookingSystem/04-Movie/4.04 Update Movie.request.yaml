$kind: http-request
name: '4.4 Update Movie'
order: 4000
method: PUT
url: '{{gateway}}/api/movies/{{movieId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
body:
  type: json
  content: |-
    {
      "title": "Hành Trình Phương Nam",
      "description": "Phim tài liệu về miền Tây sông nước.",
      "director": "Lê Hoàng",
      "durationMinutes": 120,
      "language": "Tiếng Việt",
      "ageRating": "P",
      "releaseDate": "2026-10-01",
      "genreId": "{{genreId}}",
      "movieStatus": "NOW_SHOWING"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
