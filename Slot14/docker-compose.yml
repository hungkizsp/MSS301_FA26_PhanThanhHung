name: saga-demo

services:
  # ---------- order-service DB ----------
  mysql:
    image: mysql:8.4
    container_name: saga-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
    ports:
      - "3307:3306" # host 3307 Ä‘á»ƒ khÃ´ng Ä‘á»¥ng MySQL cÃ i sáºµn trÃªn mÃ¡y
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- payment-service DB ----------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saga-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Saga@12345" # pháº£i Ä‘á»§ máº¡nh: chá»¯ hoa, thÆ°á»ng, sá»‘, kÃ½ tá»± Ä‘áº·c biá»‡t
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433" # host 14330 Ä‘á»ƒ khÃ´ng Ä‘á»¥ng SQL Server cÃ i sáºµn trÃªn mÃ¡y
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Vá»«a kiá»ƒm tra SQL Server sáºµn sÃ ng, vá»«a táº¡o database paymentdb náº¿u chÆ°a cÃ³
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Saga@12345' -C -Q \"IF DB_ID('paymentdb') IS NULL CREATE DATABASE paymentdb\" || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # ---------- inventory-service DB ----------
  mongodb:
    image: mongo:8.0
    container_name: saga-mongodb
    command: [ "--replSet", "rs0", "--bind_ip_all" ] # transaction trong MongoDB cáº§n replica set
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Láº§n Ä‘áº§u: khá»Ÿi táº¡o replica set 1 node; healthy khi node Ä‘Ã£ lÃ  PRIMARY
      test: [ "CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)" ]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  mysql-data:
  mssql-data:
  mongo-data:
